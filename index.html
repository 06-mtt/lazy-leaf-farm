<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a2148">
<meta name="apple-mobile-web-app-title" content="懶草農場">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>懶草農場</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=19">

</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hstat" id="hcoin"><img id="i_coin" alt=""><b id="coins">0</b></div>
    <div class="hstat" id="hrep"><img id="i_rep" alt=""><b id="rep">0</b></div>
    <div id="xpwrap"><div id="lvl"></div><div id="xpbar"><div id="xpfill"></div></div></div>
    <div id="wx"></div>
  </div>
  <div id="stage"><canvas id="cv" width="160" height="200"></canvas><div id="labels"></div><div id="quick"></div><div id="picker"></div></div>
  <div id="panel"><header><div><h2 id="ptitle"></h2><span id="psub"></span></div><button type="button" id="pclose" aria-label="關閉">✕</button></header><div id="plist"></div></div>
  <div id="tabs">
    <button type="button" data-tab="bag"><img alt="" data-ti="bag"><span>背包</span><em id="b_bag"></em></button>
    <button type="button" data-tab="pets"><img alt="" data-ti="paw"><span>寵物</span><em id="b_pets"></em></button>
    <button type="button" data-tab="ach"><img alt="" data-ti="scroll"><span>任務</span><em id="b_ach"></em></button>
    <button type="button" id="go"><img alt="" data-ti="town" id="goicon"><span id="golbl">去小鎮</span></button>
    <button type="button" data-tab="upg"><img alt="" data-ti="menu"><span>更多</span><em id="b_upg"></em></button>
  </div>
  <div id="fishview"><div id="fwrap"><canvas id="fcv" width="96" height="54"></canvas></div><div id="fmsg"></div><div id="fbtns"></div></div>
  <div id="toast"></div>
  <div id="modal"><div id="mbox"><canvas id="mart" width="12" height="10"></canvas><h3 id="mtitle"></h3><div id="mbody"></div><div id="mbtns"></div></div></div>
  <div id="gate"><div id="gbox"><img id="glogo" alt=""><h1>懶草農場</h1><div id="gbody"></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="data.js?v=19"></script>
<script src="game.js?v=19"></script>

</body>
</html>
