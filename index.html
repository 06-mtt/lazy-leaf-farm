<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a2148">
<title>懶草農場</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 版面：直式單欄。上方狀態列、中間像素畫布、下方分頁列；面板從底部滑出。單一黃昏主題。 */
:root{
  color-scheme: dark;
  --night:#2a2148;
  --dusk:#3d2a5e;
  --panel:#35284f;
  --panel-2:#463566;
  --line:#5e4a82;
  --cream:#f6e7c8;
  --muted:#b9a8cf;
  --peach:#ee9a72;
  --leaf:#8fd67a;
  --coin:#f5c451;
  --bad:#ef7a8a;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --body:-apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--night);color:var(--cream);font-family:var(--body);font-size:15px;
  overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
#app{
  height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:var(--dusk);
}
@media (min-width:520px){ #app{border-left:4px solid var(--line);border-right:4px solid var(--line)} }

/* 狀態列 */
#hud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:4px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:5px;min-width:0}
.stat b{font-family:var(--pixel);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted)}
#coins{color:var(--coin)}
#xpwrap{flex:1}
#xpbar{height:8px;background:var(--night);border:2px solid var(--line)}
#xpfill{height:100%;width:0;background:var(--leaf)}
#seedchip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel-2);color:var(--cream);
  border:2px solid var(--line);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap
}
#seedchip i{width:10px;height:10px;display:block}

/* 畫布 */
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2a2148 50%,#4d7a5a 50%)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer}

/* 分頁列 */
#tabs{display:flex;background:var(--panel);border-top:4px solid var(--line)}
#tabs button{
  flex:1;padding:16px 0;background:none;border:0;border-right:2px solid var(--line);color:var(--cream);
  font:inherit;font-size:13px;cursor:pointer
}
#tabs button:last-child{border-right:0}
#tabs button.on{background:var(--peach);color:var(--night)}
button:focus-visible{outline:3px solid var(--coin);outline-offset:-3px}

/* 面板 */
#panel{
  position:absolute;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));max-height:62%;
  background:var(--panel);border-top:4px solid var(--line);display:none;flex-direction:column
}
#panel.open{display:flex}
#panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:2px solid var(--line)}
#panel h2{margin:0;font-size:16px;font-weight:600}
#panel header span{font-size:12px;color:var(--muted)}
#plist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .sw{width:18px;height:18px;flex:none;border:2px solid var(--night)}
.row .info{flex:1;min-width:0}
.row .info strong{display:block;font-weight:600}
.row .info small{color:var(--muted);font-size:12px;line-height:1.5;display:block}
.row.locked{opacity:.5}
.up{color:var(--leaf)} .down{color:var(--bad)}
.btn{
  flex:none;min-width:76px;padding:10px 12px;background:var(--leaf);color:var(--night);border:0;
  border-bottom:4px solid #4f9a52;font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn[disabled]{background:var(--panel-2);color:var(--muted);border-bottom-color:var(--line);cursor:default}
.btn.alt{background:var(--peach);border-bottom-color:#b8684a}
.btn.wide{width:100%;margin-top:12px}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 0 4px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:10px 0}
.card{position:relative;background:var(--night);border:3px solid var(--rar);padding:10px 4px 6px;text-align:center;color:var(--cream);font:inherit;font-size:12px;cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;border:9px solid transparent;border-top-color:var(--rar);border-left-color:var(--rar)}
.card img{image-rendering:pixelated;width:48px;height:48px;display:block;margin:0 auto 4px}
.card b{position:absolute;right:4px;top:4px;font-family:var(--pixel);font-size:9px;font-weight:400}
.card.none{opacity:.45} .card.none img{filter:grayscale(1) brightness(.55)}
.card.sel{background:var(--panel-2)}
.detail{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.picon{image-rendering:pixelated;width:48px;height:48px;flex:none;border:3px solid var(--rar);background:var(--night);box-sizing:content-box;padding:2px}
.hearts{color:var(--bad)!important;letter-spacing:2px}
.slots{display:flex;align-items:center;gap:10px;padding:12px 0 4px}
.slot{flex:1;min-height:58px;background:var(--night);border:3px dashed var(--line);color:var(--cream);font:inherit;font-size:13px;padding:8px;cursor:pointer}
.slot.full{border-style:solid;border-color:var(--rar)}
.sec{margin:14px 0 2px;font-size:13px;color:var(--peach);font-weight:600}
.lbl{position:absolute;transform:translate(-50%,0);background:rgba(42,33,72,.88);border:2px solid var(--peach);padding:2px 6px;font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;pointer-events:none;display:none}
.lbl small{display:block;font-size:9px;color:var(--muted)}
#wx{position:absolute;left:8px;top:8px;background:rgba(42,33,72,.85);border:2px solid var(--line);padding:3px 7px;font-size:11px;z-index:2}
/* 提示與事件 */
#toast{
  position:absolute;left:50%;top:calc(108px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--night);border:2px solid var(--peach);padding:8px 12px;font-size:13px;
  max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5
}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;background:rgba(20,14,36,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.open{display:flex}
#mbox{background:var(--panel);border:4px solid var(--peach);padding:18px;width:100%;max-width:340px;text-align:center}
#mbox canvas{margin:0 auto 12px;cursor:default}
#mbox h3{margin:0 0 8px;font-size:17px;text-wrap:balance}
#mbox p{margin:0 0 6px;font-size:14px;line-height:1.6;color:var(--cream)}
#mbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
#mbtns .btn{width:100%}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><b id="coins">0</b><small>金幣</small></div>
    <div class="stat" id="xpwrap">
      <b id="lvl">LV 1</b>
      <div id="xpbar"><div id="xpfill"></div></div>
    </div>
    <button id="seedchip" type="button"><i id="seedsw"></i><span id="seedname"></span></button>
  </div>
  <div id="stage"><canvas id="cv" width="160" height="200"></canvas><div id="labels"></div><div id="wx"></div></div>
  <div id="panel"><header><h2 id="ptitle"></h2><span id="psub"></span><button type="button" id="pclose" class="btn ghost" style="min-width:0;padding:6px 10px">關閉</button></header><div id="plist"></div></div>
  <div id="tabs">
    <button type="button" data-tab="seeds">種子</button>
    <button type="button" data-tab="bag">背包</button>
    <button type="button" data-tab="pets">寵物</button>
    <button type="button" data-tab="ach">任務</button>
    <button type="button" id="go">去小鎮</button>

  <div id="modal"><div id="mbox"><canvas id="mart" width="12" height="10"></canvas><h3 id="mtitle"></h3><div id="mbody"></div><div id="mbtns"></div></div></div>
</div>

<script>
(function(){
'use strict';

/* ---------- 遊戲資料（品種皆為虛構） ---------- */
var STRAINS=[
  {id:'lazy',  name:'懶懶綠',   cost:5,   time:30,   base:17,  color:'#8fd67a', lvl:1, trait:'hardy',   tname:'好養',     tdesc:'忘記澆水也不影響品質'},
  {id:'purple',name:'紫雲朵',   cost:15,  time:90,   base:48,  color:'#b48cf2', lvl:2, trait:'thirsty', tname:'愛喝水',   tdesc:'要澆比較多次，全程沒乾過品質運氣大增'},
  {id:'lemon', name:'檸檬電波', cost:40,  time:240,  base:110, color:'#f2e35c', lvl:4, trait:'spark',   tname:'電波',     tdesc:'收成時讓上下左右的作物瞬間長大一截'},
  {id:'milk',  name:'宇宙奶昔', cost:90,  time:600,  base:230, color:'#7fd8f0', lvl:6, trait:'night',   tname:'夜行',     tdesc:'晚上 6 點到早上 6 點長得快，白天長得慢'},
  {id:'gold',  name:'黃金阿嬤', cost:200, time:1800, base:540, color:'#f5b942', lvl:9, trait:'heirloom',tname:'慢工細活', tdesc:'品質運氣高，但同一塊地連種會退步得更快'},
  /* 以下是配種才能得到的品種，種子買不到 */
  {id:'clover', name:'四葉懶懶', cost:0,time:45,  base:34,  color:'#5fd08a',lvl:0,gen:1,trait:'hardy lucky',         tname:'幸運',  tdesc:'不怕乾，品質運氣特別高'},
  {id:'mint',   name:'薄荷晚霞', cost:0,time:60,  base:45,  color:'#7fe0c0',lvl:0,gen:1,trait:'hardy',               tname:'清涼',  tdesc:'不怕乾，比懶懶綠值錢'},
  {id:'lime',   name:'青檸懶骨頭',cost:0,time:120, base:80,  color:'#c6e85c',lvl:0,gen:1,trait:'hardy spark',         tname:'懶電波',tdesc:'不怕乾，收成時帶動相鄰作物'},
  {id:'grape',  name:'葡萄汽水', cost:0,time:180, base:125, color:'#9a6cf0',lvl:0,gen:1,trait:'thirsty spark',       tname:'氣泡',  tdesc:'愛喝水，收成時帶動相鄰作物'},
  {id:'aurora', name:'極光雪酪', cost:0,time:420, base:240, color:'#7ff0d8',lvl:0,gen:1,trait:'spark night',         tname:'極光',  tdesc:'夜行，收成時帶動相鄰作物'},
  {id:'moon',   name:'月光金沙', cost:0,time:1200,base:540, color:'#f0e0a0',lvl:0,gen:1,trait:'night heirloom',      tname:'月光',  tdesc:'夜行，品質運氣高，連種退步快'},
  {id:'rainbow',name:'彩虹糖霜', cost:0,time:300, base:270, color:'#ff9ad5',lvl:0,gen:2,trait:'hardy spark lucky',   tname:'彩虹',  tdesc:'不怕乾、帶動相鄰、品質運氣高'},
  {id:'typhoon',name:'熱帶颱風', cost:0,time:240, base:220, color:'#4fc3f7',lvl:0,gen:2,trait:'thirsty spark',       tname:'暴風',  tdesc:'愛喝水，收成時帶動相鄰作物'},
  {id:'galaxy', name:'銀河鑽石', cost:0,time:2400,base:1300,color:'#c9d6ff',lvl:0,gen:2,trait:'night heirloom lucky',tname:'星塵',  tdesc:'夜行，品質運氣極高，連種退步快'},
  {id:'phoenix',name:'鳳凰之淚', cost:0,time:3600,base:2800,color:'#ef4a4a',lvl:0,gen:3,trait:'lucky heirloom spark',tname:'不死鳥',tdesc:'品質運氣極高，收成時帶動相鄰作物'}
];
/* 配種表：兩個親代配出新品種，ch 是基礎成功率，親代品質每一級再 +4% */
var RECIPES=[
  {a:'lazy',b:'lazy',out:'clover',ch:0.12},{a:'lazy',b:'purple',out:'mint',ch:0.55},{a:'lazy',b:'lemon',out:'lime',ch:0.55},
  {a:'purple',b:'lemon',out:'grape',ch:0.55},{a:'lemon',b:'milk',out:'aurora',ch:0.5},{a:'milk',b:'gold',out:'moon',ch:0.45},
  {a:'mint',b:'grape',out:'rainbow',ch:0.4},{a:'lime',b:'grape',out:'typhoon',ch:0.4},{a:'aurora',b:'moon',out:'galaxy',ch:0.3},
  {a:'rainbow',b:'galaxy',out:'phoenix',ch:0.2}
];
/* 天氣每 30 分鐘換一次、季節每 3 天換一次，都由時間決定，之後所有玩家會看到同樣的天氣 */
var WX=[{id:'sun',n:'晴天',d:'一切正常'},{id:'rain',n:'雨天',d:'自動澆水'},{id:'heat',n:'熱浪',d:'長得快，水也乾得快'},{id:'fog',n:'起霧',d:'品質運氣提高'},{id:'bow',n:'彩虹',d:'品質運氣大增'}];
function weather(now){ var r=rnd(Math.floor(now/1800000)*17+3); return WX[r<0.45?0:(r<0.67?1:(r<0.82?2:(r<0.95?3:4)))]; }
var SEASONS=['春','夏','秋','冬'];
function season(now){ return Math.floor(now/259200000)%4; }
var SEASON_OF={lazy:0,clover:0,mint:0,lime:0,lemon:1,grape:1,typhoon:1,purple:2,gold:2,moon:2,rainbow:2,milk:3,aurora:3,galaxy:3,phoenix:3};
function inSeason(st,now){ return SEASON_OF[st.id]===season(now); }
var TRIPS=[{n:'30 分',ms:1800000,rolls:1},{n:'2 小時',ms:7200000,rolls:3},{n:'8 小時',ms:28800000,rolls:8}];
function findRecipe(a,b){ for(var i=0;i<RECIPES.length;i++){ var r=RECIPES[i]; if((r.a===a&&r.b===b)||(r.a===b&&r.b===a)) return r; } return null; }
function has(st,t){ return (' '+st.trait+' ').indexOf(' '+t+' ')>=0; }
var GOODS={juice:{name:'綜合果汁',desc:'兩種作物榨的，價格固定，不受行情和飽和影響。'},jam:{name:'手工果醬',desc:'三株同品種熬的，價格固定，不受行情和飽和影響。'}};
/* 品質六級，對應稀有度顏色；售價倍率依品質提高 */
var QMULT=[1,1.3,1.8,2.6,4,8];
var SMAP={}; STRAINS.forEach(function(s,i){s.idx=i;SMAP[s.id]=s;});
var PLOT_COST=[0,0,0,50,150,400,1000,2500,6000];
var UPG={
  fert:{name:'有機肥料',desc:'成長速度 +25%',max:3,cost:[120,500,2000]},
  sprinkler:{name:'自動灑水器',desc:'再也不用手動澆水',max:1,cost:[800]},
  speaker:{name:'Lofi 音響',desc:'植物聽了心情好，售價 +10%',max:3,cost:[200,900,3500]}
};
/* 稀有度：普通、一般、精良、稀有、傳說，最後一級保留給之後的內容 */
var RAR=[{n:'普通',c:'#8d8a99'},{n:'一般',c:'#f4f1ea'},{n:'精良',c:'#5aa0f2'},{n:'稀有',c:'#b06cf0'},{n:'傳說',c:'#f5c451'},{n:'神話',c:'#ef4a4a'}];
var SDESC={lazy:'長得快、不挑土，新手的好朋友。',purple:'聞起來像下雨前的雲。',lemon:'據說半夜會自己發光。',milk:'外星人最愛的口味。',gold:'阿嬤看了都說讚的傳家寶。',clover:'一千株裡才有一株的四片葉子。',mint:'涼涼的，像傍晚的風。',lime:'酸到會醒，但它自己很懶。',grape:'搖一搖會冒泡。',aurora:'在暗處會微微發光。',moon:'只在夜裡閃著金粉。',rainbow:'每一口顏色都不一樣。',typhoon:'靠近會聽到風聲。',galaxy:'裡面好像有星星在轉。',phoenix:'傳說枯掉了還會再長回來。'};
var ITEMS=[
  {id:'pickle',  name:'阿嬤的醃菜', rar:0, value:8,   desc:'阿嬤硬塞給你的，很下飯。'},
  {id:'hairball',name:'貓毛球',     rar:1, value:15,  desc:'摸貓的紀念品，意外地搶手。'},

var IMAP={}; ITEMS.forEach(function(it){IMAP[it.id]=it;});
var PETS=[
  {id:'chick',name:'小雞啾啾',  rar:0,base:0.20,label:'收成經驗',   cost:{coins:150},        pace:60, hop:1,faceRight:true},

var ACH=[

  {id:'land',  name:'大地主',       desc:'解鎖全部 9 塊地',     reward:1500,ok:function(s){return s.plots.every(function(p){return p.u;});}},
  {id:'gold',  name:'阿嬤的驕傲',   desc:'收成 1 株黃金阿嬤',   reward:800, ok:function(s){return s.stats.gold>=1;}},

  for(var i=0;i<n;i++){ var h=new Date(a+step*(i+0.5)).getHours(); if(h>=18||h<6) c++; }

}

function luck(p,st){
  var care=has(st,'hardy')?1:1-Math.min(1,Math.max(0,(p.dry||0)-5)/Math.max(30,st.time*0.5));
  var L=0.4*care+0.08*S.upg.fert+petBonus('cat')+(p.rot||0)+(S.charm>0?0.25:0);
  if(has(st,'heirloom')) L+=0.2;
  if(has(st,'lucky')) L+=0.2;
  var wxid=weather(Date.now()).id; if(wxid==='fog') L+=0.1; if(wxid==='bow') L+=0.2;
  if(has(st,'thirsty')&&!((p.dry||0)>5)) L+=0.15;

}
function rollQ(L){
  var a=[50,30,14,5,1,0], b=[4,22,36,26,11.5,0], w=[], sum=0, i;
  for(i=0;i<6;i++){ w[i]=a[i]+(b[i]-a[i])*L; }
  if(L>=0.7) w[5]=0.5*(L-0.7)/0.3;
  for(i=0;i<6;i++) sum+=w[i];
  var r=Math.random()*sum;
  for(i=0;i<6;i++){ r-=w[i]; if(r<0) return i; }
  return 0;
}

    } else {
      grow(p,now);
      var st=SMAP[p.crop];

        var q=rollQ(luck(p,st));
        S.inv[st.id][q]++; S.dex[st.id+q]=1; S.stats.harvest++; if(st.id==='gold') S.stats.gold++;

        addXp(Math.ceil(st.time/10*(1+petBonus('chick'))*(1+0.2*q))); p.crop=null; p.prog=0;

      } else if(now>=p.water){

    }

});

    else if(r<0.7){ var tr=Math.random(), it=tr<0.45?'pickle':(tr<0.8?'hairball':(tr<0.95?'whistle':'meteor')); give(it); add(IMAP[it].name); }

      S.job={t:'juice',v:Math.round((A.st.base*QMULT[A.q]+B.st.base*QMULT[B.q])*1.35),q:Math.max(A.q,B.q),until:now+60000}; toast('開始榨果汁');
    } else if(act==='jam'&&A&&A.n>=3&&!S.job){
      S.inv[A.id][A.q]-=3;
      S.job={t:'jam',v:Math.round(A.st.base*QMULT[A.q]*3*1.15),q:A.q,until:now+120000}; toast('開始熬果醬');
    }
    fixLab();
  }
  else if(act==='collect'){ if(S.job&&now>=S.job.until){ S.goods.push({t:S.job.t,v:S.job.v,q:S.job.q}); toast(GOODS[S.job.t].name+'做好了，到市場賣'); S.job=null; } }
  else if(act==='sellgoods'){ var gv=goodsValue(); if(gv){ S.goods=[]; addCoins(gv); toast('賣出加工品，進帳 '+gv+' 金幣'); } }
  else if(act==='music'){ toggleMusic(); }
  else if(act==='trip'){
    var tk=id.split(':'), to=S.pets[tk[0]];
    if(to&&!to.trip){ to.trip={until:now+TRIPS[+tk[1]].ms,rolls:TRIPS[+tk[1]].rolls}; toast('「'+PMAP[tk[0]].name+'」出發探險了'); }
  }
  else if(act==='tripback'){
    var bo=S.pets[id];
    if(bo&&bo.trip&&now>=bo.trip.until){ var loot=tripLoot(id,bo.trip.rolls); bo.trip=null; bo.aff++; modal('star','「'+PMAP[id].name+'」回來了',loot,[['收下']]); }
  }
  else if(act==='buyland'){
    var li=-1; S.plots.forEach(function(p,k){ if(li<0&&!p.u) li=k; });
    if(li>=0&&S.coins>=PLOT_COST[li]){ S.coins-=PLOT_COST[li]; S.plots[li].u=true; toast('新的一塊地到手，回農場看看'); }
  }
  else if(act==='reset'){ if(!resetArm){ resetArm=true; } else { Store.clear(); S=fresh(); normalize(); resetArm=false; toast('進度已重置'); } }
  if(act!=='reset') resetArm=false;
  checkAch(); hud(); refreshPanel(); Store.save(S);
});

        else { var fine=Math.round(S.coins*0.15), ps=planted(), lost='';

      }],

  },

      ['摸摸牠',function(){ S.stats.cat++; addCoins(pay); var hb=Math.random()<0.4; if(hb) give('hairball');
        toast(S.stats.cat>=3&&!S.pets.cat?'牠好像想跟你回家，到「寵物」看看':'貓咪叼來 '+pay+' 金幣'+(hb?'和一顆毛球':'')); }],
      ['假裝沒看到']
    ]);
  },
  granny:function(){
    var held=STRAINS.filter(function(s){return invCount(s.id)>0;});
    give('pickle');
    if(!held.length){ var gift=20+10*S.lvl; addCoins(gift);
      modal('granny','隔壁阿嬤來串門子',['「少年欸，種菜辛苦齁。」','阿嬤塞了 '+gift+' 金幣紅包和一罐醃菜給你。'],[['謝謝阿嬤']]); return; }
    var s=held[0], n=invCount(s.id), pay=Math.round(S.inv[s.id].reduce(function(a,c,q){return a+c*s.base*2*QMULT[q];},0));
    modal('granny','隔壁阿嬤來買菜',['「你這地瓜葉看起來很嫩，我全包了。」','「'+s.name+'」 ×'+n+'，阿嬤出 '+pay+' 金幣（行情兩倍），還送你一罐醃菜。'],[
      ['賣給阿嬤',function(){ S.inv[s.id]=[0,0,0,0,0,0]; addCoins(pay); toast('阿嬤開心地提著菜回家'); }],
      ['「阿嬤這個不能炒啦」']
    ]);
  },
  merchant:function(){
    var cost=60+40*S.lvl;
    modal('merchant','流浪商人路過',['「幸運符要不要？接下來 5 次收成，品質運氣大增。」','他看起來隨時會走。'],[
      ['買一張（-'+cost+' 金幣）',function(){ if(S.coins<cost){ toast('金幣不夠，商人聳聳肩走了'); return; } S.coins-=cost; S.charm+=5; toast('買了幸運符，接下來 5 次收成有效'); }],

function welcome(away){
  if(modalOpen||away<300000) return;
  var now=Date.now(), ripe=0, dry=[], lines=['你離開了 '+fmt(away/1000)+'。'];
  S.plots.forEach(function(p){ if(!p.crop) return; if(isRipe(p)) ripe++; else if(now>=p.water) dry.push(p); });
  if(dry.length&&away>600000&&Math.random()<0.35){ dry.forEach(function(p){ p.water=now+waterSpan(SMAP[p.crop]); }); lines.push('剛剛下了一場雨，'+dry.length+' 株作物都澆好了。'); dry=[]; }
  if(ripe) lines.push(ripe+' 株作物成熟了，可以收成。');
  if(dry.length) lines.push(dry.length+' 株作物在等你澆水。');
  if(S.tasks.length) lines.push('公告欄上有 '+S.tasks.length+' 個限時任務。');
  if(lines.length>1) modal('star','歡迎回來',lines,[['開工']]);
}
var nextEvent=Date.now()+240000+Math.random()*120000;
function maybeEvent(now){
  if(modalOpen||tab||now<nextEvent) return;
  nextEvent=now+480000+Math.random()*420000;
  var pool=['cat','cat','cat','cat','cat','granny','granny','granny','granny','merchant','merchant','merchant'];
  if(planted().length){ pool.push('police','police','police','police','police','ufo','ufo','ufo'); }
  EVENTS[pick(pool)]();
}

/* ---------- Lofi 背景音樂（即時合成，不需要音檔） ---------- */
var AC=null, musicOn=false, beat=0, nextBeat=0, master=null, mTimer=0;
var CHORDS=[[174.6,220,261.6,329.6],[164.8,196,246.9,293.7],[146.8,174.6,220,261.6],[130.8,164.8,196,246.9]];
function tone(f,t,d,g,type){ var o=AC.createOscillator(), a=AC.createGain(); o.type=type||'triangle'; o.frequency.value=f;
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+0.08); a.gain.linearRampToValueAtTime(0,t+d); o.connect(a); a.connect(master); o.start(t); o.stop(t+d+0.05); }
function noise(t,d,g){ var n=AC.sampleRate*d, buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0);
  for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); var s=AC.createBufferSource(), a=AC.createGain(); s.buffer=buf; a.gain.value=g; s.connect(a); a.connect(master); s.start(t); }
function kick(t){ var o=AC.createOscillator(), a=AC.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.15);
  a.gain.setValueAtTime(0.5,t); a.gain.exponentialRampToValueAtTime(0.001,t+0.25); o.connect(a); a.connect(master); o.start(t); o.stop(t+0.3); }
function schedule(){
  var spb=60/74/2;
  while(nextBeat<AC.currentTime+0.4){
    var b=beat%8, bar=Math.floor(beat/8)%4;
    if(b===0) CHORDS[bar].forEach(function(f){ tone(f,nextBeat,spb*8,0.045); });
    if(b===0||b===5) kick(nextBeat);
    if(b===2||b===6) noise(nextBeat,0.12,0.09);
    if(b%2===1) noise(nextBeat+(b%4===3?0.03:0),0.03,0.035);
    if(b===3||b===7) tone(CHORDS[bar][(beat>>1)%4]*2,nextBeat,spb*1.6,0.03,'sine');
    nextBeat+=spb; beat++;
  }
}
function toggleMusic(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100;
      master=AC.createGain(); master.gain.value=0.9; master.connect(lp); lp.connect(AC.destination); }
    musicOn=!musicOn;
    if(musicOn){ AC.resume(); nextBeat=AC.currentTime+0.1; beat=0; mTimer=setInterval(schedule,120); }
    else { clearInterval(mTimer); AC.suspend(); }
  }catch(err){ toast('這個瀏覽器無法播放音樂'); }
}

var ticks=0;
function tick(){
  var now=Date.now();
  S.plots.forEach(function(p){ grow(p,now); });
  var wxn=weather(now);
  if(wxn.id==='rain') S.plots.forEach(function(p){ if(p.crop) p.water=Math.max(p.water,now+90000); });
  $('wx').textContent=SEASONS[season(now)]+'季・'+wxn.n+'：'+wxn.d;
  var broke=S.coins<STRAINS[0].cost&&!planted().length&&!STRAINS.some(function(s){return invCount(s.id)>0;});
  tasksTick(now); S.seenAt=now;
  if(broke){ S.coins+=10; toast('阿嬤看你可憐，塞了 10 金幣給你'); }
  checkAch(); hud(); if(tab==='market'||tab==='pets'||tab==='ach'||(tab==='lab'&&S.job)) refreshPanel(); maybeEvent(now);
  if(++ticks%5===0) Store.save(S);
}
var awayMs=S.seenAt?Date.now()-S.seenAt:0, hiddenAt=0;
setInterval(tick,1000); tick(); welcome(awayMs);
document.addEventListener('visibilitychange',function(){ if(document.hidden){ hiddenAt=Date.now(); Store.save(S); } else { tick(); if(hiddenAt) welcome(Date.now()-hiddenAt); } });
if(S.stats.harvest===0&&!planted().length) setTimeout(function(){ toast('點一塊空地種下第一株'); },600);
})();
