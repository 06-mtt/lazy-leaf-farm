<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a2148">
<title>懶草農場</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 版面：直式單欄。上方狀態列、中間像素畫布、下方分頁列；面板從底部滑出。單一黃昏主題。 */
:root{
  color-scheme: dark;
  --night:#2a2148;
  --dusk:#3d2a5e;
  --panel:#35284f;
  --panel-2:#463566;
  --line:#5e4a82;
  --cream:#f6e7c8;
  --muted:#b9a8cf;
  --peach:#ee9a72;
  --leaf:#8fd67a;
  --coin:#f5c451;
  --bad:#ef7a8a;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --body:-apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--night);color:var(--cream);font-family:var(--body);font-size:15px;
  overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
#app{
  height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:var(--dusk);
}
@media (min-width:520px){ #app{border-left:4px solid var(--line);border-right:4px solid var(--line)} }

/* 狀態列 */
#hud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:4px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:5px;min-width:0}
.stat b{font-family:var(--pixel);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted)}
#coins{color:var(--coin)}
#xpwrap{flex:1}
#xpbar{height:8px;background:var(--night);border:2px solid var(--line)}
#xpfill{height:100%;width:0;background:var(--leaf)}
#seedchip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel-2);color:var(--cream);
  border:2px solid var(--line);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap
}
#seedchip i{width:10px;height:10px;display:block}

/* 畫布 */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2a2148 50%,#4d7a5a 50%)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer}

/* 分頁列 */
#tabs{display:flex;background:var(--panel);border-top:4px solid var(--line)}
#tabs button{
  flex:1;padding:16px 0;background:none;border:0;border-right:2px solid var(--line);color:var(--cream);
  font:inherit;font-size:13px;cursor:pointer
}
#tabs button:last-child{border-right:0}
#tabs button.on{background:var(--peach);color:var(--night)}
button:focus-visible{outline:3px solid var(--coin);outline-offset:-3px}

/* 面板 */
#panel{
  position:absolute;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));max-height:62%;
  background:var(--panel);border-top:4px solid var(--line);display:none;flex-direction:column
}
#panel.open{display:flex}
#panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:2px solid var(--line)}
#panel h2{margin:0;font-size:16px;font-weight:600}
#panel header span{font-size:12px;color:var(--muted)}
#plist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .sw{width:18px;height:18px;flex:none;border:2px solid var(--night)}
.row .info{flex:1;min-width:0}
.row .info strong{display:block;font-weight:600}
.row .info small{color:var(--muted);font-size:12px;line-height:1.5;display:block}
.row.locked{opacity:.5}
.up{color:var(--leaf)} .down{color:var(--bad)}
.btn{
  flex:none;min-width:76px;padding:10px 12px;background:var(--leaf);color:var(--night);border:0;
  border-bottom:4px solid #4f9a52;font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn[disabled]{background:var(--panel-2);color:var(--muted);border-bottom-color:var(--line);cursor:default}
.btn.alt{background:var(--peach);border-bottom-color:#b8684a}
.btn.wide{width:100%;margin-top:12px}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 0 4px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:10px 0}
.card{position:relative;background:var(--night);border:3px solid var(--rar);padding:10px 4px 6px;text-align:center;color:var(--cream);font:inherit;font-size:12px;cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;border:9px solid transparent;border-top-color:var(--rar);border-left-color:var(--rar)}
.card img{image-rendering:pixelated;width:48px;height:48px;display:block;margin:0 auto 4px}
.card b{position:absolute;right:4px;top:4px;font-family:var(--pixel);font-size:9px;font-weight:400}
.card.none{opacity:.45} .card.none img{filter:grayscale(1) brightness(.55)}
.card.sel{background:var(--panel-2)}
.detail{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.picon{image-rendering:pixelated;width:48px;height:48px;flex:none;border:3px solid var(--rar);background:var(--night);box-sizing:content-box;padding:2px}
.hearts{color:var(--bad)!important;letter-spacing:2px}
/* 提示與事件 */
#toast{
  position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--night);border:2px solid var(--peach);padding:8px 12px;font-size:13px;
  max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5
}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;background:rgba(20,14,36,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.open{display:flex}
#mbox{background:var(--panel);border:4px solid var(--peach);padding:18px;width:100%;max-width:340px;text-align:center}
#mbox canvas{margin:0 auto 12px;cursor:default}
#mbox h3{margin:0 0 8px;font-size:17px;text-wrap:balance}
#mbox p{margin:0 0 6px;font-size:14px;line-height:1.6;color:var(--cream)}
#mbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
#mbtns .btn{width:100%}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><b id="coins">0</b><small>金幣</small></div>
    <div class="stat" id="xpwrap">
      <b id="lvl">LV 1</b>
      <div id="xpbar"><div id="xpfill"></div></div>
    </div>
    <button id="seedchip" type="button"><i id="seedsw"></i><span id="seedname"></span></button>
  </div>
  <div id="stage"><canvas id="cv" width="160" height="200"></canvas></div>
  <div id="panel"><header><h2 id="ptitle"></h2><span id="psub"></span></header><div id="plist"></div></div>
  <div id="tabs">
    <button type="button" data-tab="seeds">種子</button>
    <button type="button" data-tab="bag">背包</button>
    <button type="button" data-tab="market">市場</button>
    <button type="button" data-tab="pets">寵物</button>
    <button type="button" data-tab="upg">升級</button>
    <button type="button" data-tab="ach">成就</button>
    <button type="button" id="music">音樂</button>
  </div>
  <div id="toast"></div>
  <div id="modal"><div id="mbox"><canvas id="mart" width="12" height="10"></canvas><h3 id="mtitle"></h3><div id="mbody"></div><div id="mbtns"></div></div></div>
</div>

<script>
(function(){
'use strict';

/* ---------- 遊戲資料（品種皆為虛構） ---------- */
var STRAINS=[
  {id:'lazy',  name:'懶懶綠',   cost:5,   time:30,   base:14,   color:'#8fd67a', lvl:1},
  {id:'purple',name:'紫雲朵',   cost:20,  time:90,   base:55,   color:'#b48cf2', lvl:2},
  {id:'lemon', name:'檸檬電波', cost:60,  time:240,  base:170,  color:'#f2e35c', lvl:4},
  {id:'milk',  name:'宇宙奶昔', cost:180, time:600,  base:520,  color:'#7fd8f0', lvl:6},
  {id:'gold',  name:'黃金阿嬤', cost:600, time:1800, base:1800, color:'#f5b942', lvl:9}
];
var SMAP={}; STRAINS.forEach(function(s,i){s.idx=i;SMAP[s.id]=s;});
var PLOT_COST=[0,0,0,50,150,400,1000,2500,6000];
var UPG={
  fert:{name:'有機肥料',desc:'成長速度 +25%',max:3,cost:[120,500,2000]},
  sprinkler:{name:'自動灑水器',desc:'再也不用手動澆水',max:1,cost:[800]},
  speaker:{name:'Lofi 音響',desc:'植物聽了心情好，售價 +10%',max:3,cost:[200,900,3500]}
};
/* 稀有度：普通、一般、精良、稀有、傳說，最後一級保留給之後的內容 */
var RAR=[{n:'普通',c:'#8d8a99'},{n:'一般',c:'#f4f1ea'},{n:'精良',c:'#5aa0f2'},{n:'稀有',c:'#b06cf0'},{n:'傳說',c:'#f5c451'},{n:'神話',c:'#ef4a4a'}];
var SDESC={lazy:'長得快、不挑土，新手的好朋友。',purple:'聞起來像下雨前的雲。',lemon:'據說半夜會自己發光。',milk:'外星人最愛的口味。',gold:'阿嬤看了都說讚的傳家寶。'};
var ITEMS=[
  {id:'pickle',  name:'阿嬤的醃菜', rar:0, value:8,   desc:'阿嬤硬塞給你的，很下飯。'},
  {id:'hairball',name:'貓毛球',     rar:1, value:15,  desc:'摸貓的紀念品，意外地搶手。'},
  {id:'whistle', name:'警察的哨子', rar:2, value:120, desc:'警察杯杯走太急忘了帶走。'},
  {id:'meteor',  name:'外星隕石',   rar:3, value:400, desc:'幽浮掉下來的，摸起來溫溫的。'}
];
var IMAP={}; ITEMS.forEach(function(it){IMAP[it.id]=it;});
var PETS=[
  {id:'chick',name:'小雞啾啾',  rar:0,base:0.20,label:'收成經驗',   cost:{coins:150},        pace:60, hop:1,faceRight:true},
  {id:'cat',  name:'橘貓麻糬',  rar:1,base:0.10,label:'大豐收機率', cost:{cat:3},            pace:90, hop:0,faceRight:false},
  {id:'dog',  name:'柴犬阿福',  rar:2,base:0.25,label:'裝傻成功率', cost:{coins:600},        pace:50, hop:0,faceRight:true},
  {id:'alien',name:'外星寶寶咕嚕',rar:3,base:0.15,label:'成長速度', cost:{item:'meteor',n:2},pace:120,hop:1,faceRight:true}
];
var PMAP={}; PETS.forEach(function(p){PMAP[p.id]=p;});
var ACH=[
  {id:'first', name:'第一次收成',   desc:'收成 1 株',           reward:20,  ok:function(s){return s.stats.harvest>=1;}},
  {id:'h50',   name:'綠手指',       desc:'收成 50 株',          reward:300, ok:function(s){return s.stats.harvest>=50;}},
  {id:'h300',  name:'農場老手',     desc:'收成 300 株',         reward:2000,ok:function(s){return s.stats.harvest>=300;}},
  {id:'rich',  name:'小有積蓄',     desc:'累積賺到 5,000 金幣', reward:500, ok:function(s){return s.stats.earned>=5000;}},
  {id:'land',  name:'大地主',       desc:'解鎖全部 9 塊地',     reward:1500,ok:function(s){return s.plots.every(function(p){return p.u;});}},
  {id:'gold',  name:'阿嬤的驕傲',   desc:'收成 1 株黃金阿嬤',   reward:800, ok:function(s){return s.stats.gold>=1;}},
  {id:'bluff', name:'九層塔大師',   desc:'對警察裝傻成功 3 次', reward:400, ok:function(s){return s.stats.bluff>=3;}},
  {id:'cat',   name:'貓奴',         desc:'摸流浪貓 5 次',       reward:150, ok:function(s){return s.stats.cat>=5;}},
  {id:'ufo',   name:'第三類接觸',   desc:'被幽浮光顧 1 次',     reward:200, ok:function(s){return s.stats.ufo>=1;}},
  {id:'zoo',   name:'動物園園長',   desc:'收集 4 隻寵物',       reward:1000,ok:function(s){return Object.keys(s.pets||{}).length>=4;}}
];

/* ---------- 存檔層：之後換成雲端存檔只需要改這一段 ---------- */
var SAVE_KEY='lazyleaf-save-v1';
var Store={
  load:function(){ try{ var r=localStorage.getItem(SAVE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },
  save:function(s){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(s)); }catch(e){} },
  clear:function(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
};
function fresh(){
  var plots=[]; for(var i=0;i<9;i++) plots.push({u:i<3,crop:null,prog:0,last:0,water:0});
  return {v:1,coins:30,xp:0,lvl:1,seed:'lazy',plots:plots,inv:{},
    upg:{fert:0,sprinkler:0,speaker:0,dog:0},
    stats:{harvest:0,earned:0,bluff:0,cat:0,ufo:0,gold:0},ach:{},items:{},pets:{}};
}
var S=Store.load();
if(!S||S.v!==1||!S.plots||S.plots.length!==9) S=fresh();
S.items=S.items||{}; S.pets=S.pets||{};
if(S.upg.dog){ S.pets.dog=S.pets.dog||{aff:0,last:0}; S.upg.dog=0; }
function hearts(id){ return S.pets[id]?Math.min(5,Math.floor(S.pets[id].aff/4)):0; }
function petBonus(id){ return S.pets[id]?PMAP[id].base*(1+0.1*hearts(id)):0; }
function give(id,n){ S.items[id]=(S.items[id]||0)+(n||1); }

/* ---------- 規則 ---------- */
function rnd(n){ var x=Math.sin(n*12.9898)*43758.5453; return x-Math.floor(x); }
function price(s,now){
  var bucket=Math.floor(now/60000);
  var mult=0.7+0.8*rnd(bucket*31+s.idx*7+1);
  return Math.max(1,Math.round(s.base*mult*(1+0.1*S.upg.speaker)));
}
function xpNeed(l){ return Math.round(12*Math.pow(l,1.8)); }
function speed(){ return (1+0.25*S.upg.fert)*(1+petBonus('alien')); }
function waterSpan(s){ return Math.max(45,s.time*0.5)*1000; }
function grow(p,now){
  if(!p.crop) return;
  if(S.upg.sprinkler) p.water=now+1e9;
  var until=Math.min(now,p.water);
  if(until>p.last) p.prog+=(until-p.last)/1000*speed();
  p.last=now;
}
function isRipe(p){ return p.crop&&p.prog>=SMAP[p.crop].time; }
function addCoins(n){ S.coins+=n; if(n>0) S.stats.earned+=n; }
function addXp(n){
  S.xp+=n;
  while(S.xp>=xpNeed(S.lvl)){
    S.xp-=xpNeed(S.lvl); S.lvl++;
    var un=STRAINS.filter(function(s){return s.lvl===S.lvl;})[0];
    toast('升到 LV '+S.lvl+(un?'，解鎖新品種「'+un.name+'」':''));
  }
}
function checkAch(){
  ACH.forEach(function(a){
    if(!S.ach[a.id]&&a.ok(S)){ S.ach[a.id]=1; addCoins(a.reward); toast('達成成就「'+a.name+'」 +'+a.reward+' 金幣'); }
  });
}
function fmt(sec){
  sec=Math.max(0,Math.ceil(sec));
  if(sec<60) return sec+' 秒';
  if(sec<3600) return Math.floor(sec/60)+' 分 '+(sec%60)+' 秒';
  return Math.floor(sec/3600)+' 小時 '+Math.floor(sec%3600/60)+' 分';
}

/* ---------- 介面元件 ---------- */
function $(id){ return document.getElementById(id); }
var toastT=0;
function toast(msg){
  var el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('show'); },2200);
}
function hud(){
  $('coins').textContent=S.coins.toLocaleString('en-US');
  $('lvl').textContent='LV '+S.lvl;
  $('xpfill').style.width=Math.min(100,S.xp/xpNeed(S.lvl)*100)+'%';
  var s=SMAP[S.seed]; $('seedname').textContent=s.name+' '+s.cost; $('seedsw').style.background=s.color;
}

/* ---------- 像素繪圖 ---------- */
var cv=$('cv'), ctx=cv.getContext('2d'), W=160, H=200;
ctx.imageSmoothingEnabled=false;
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
var BMP={
  ufo:{rows:['....cccc....','...cwwwwc...','..gggggggg..','.gygygygygg.','..gggggggg..','....y..y....','...y....y...'],
       pal:{c:'#7fd8f0',w:'#eafaff',g:'#9a8fb8',y:'#f5c451'}},
  cat:{rows:['o...o.......','oo.oo......o','ooooo.....o.','okoko.oooo..','ooooooooooo.','.oooooooooo.','.o.o....o.o.'],
       pal:{o:'#ee9a72',k:'#2a2148'}},
  police:{rows:['...bbbbbb...','..bbbybbbb..','.bbbbbbbbbb.','..kkkkkkkk..','..ssssssss..','..skssssks..','..ssssssss..','..sssrrsss..','...ssssss...'],
       pal:{b:'#4a6fd0',y:'#f5c451',k:'#2a2148',s:'#f2c9a0',r:'#c8647a'}},
  granny:{rows:['...wwwwww...','..wwwwwwww..','..wsssssww..','..skssskss..','..ssssssss..','..ssrrrsss..','...ssssss...','..pppppppp..','.pppppppppp.'],
       pal:{w:'#e6e0f0',s:'#f2c9a0',k:'#2a2148',r:'#c8647a',p:'#b48cf2'}},
  star:{rows:['.....y......','.....y......','....yyy.....','.yyyyyyyyy..','..yyyyyyy...','...yyyyy....','..yyy.yyy...','..y.....y...'],
       pal:{y:'#f5c451'}}
};
BMP.chick={rows:['..yy..','.yyyy.','yyykyo','yyyyy.','.yyyy.','.o..o.'],pal:{y:'#f7e07a',k:'#2a2148',o:'#ee9a72'}};
BMP.dog={rows:['.........tt.','t.......tttt','tt.....ttktn','.tttttttttt.','.tttttttttt.','.twwwwwwtt..','.t.t...t.t..'],pal:{t:'#e0a060',w:'#f6e7c8',k:'#2a2148',n:'#3a2433'}};
BMP.alien={rows:['.ggggg.','ggggggg','gkkgkkg','gkkgkkg','.ggggg.','..ggg..','.ggggg.','.g...g.'],pal:{g:'#9be08a',k:'#2a2148'}};
BMP.pickle={rows:['....rrrr....','...rrrrrr...','...wwwwww...','..wggggggw..','..wglggggw..','..wgggglgw..','..wggggggw..','..wglggggw..','..wggglggw..','..wggggggw..','...wwwwww...'],pal:{r:'#c8647a',w:'#cfe8e8',g:'#8fae4a',l:'#c9d77a'}};
BMP.hairball={rows:['....oooo....','..oooooooo..','.oookoooooo.','.oooookoooo.','.ookooooooo.','.oooooookoo.','.ooookooooo.','..oooooooo..','....oooo....'],pal:{o:'#ee9a72',k:'#b8684a'}};
BMP.whistle={rows:['..bbbbbbb...','.bbbbbbbbbyy','.bbkkbbbbbyy','.bbkkbbbb...','.bbbbbbbb...','..bbbbbb....','............','..y..y..y...'],pal:{b:'#5aa0f2',k:'#2a2148',y:'#f5c451'}};
BMP.meteor={rows:['..........c.','........cc..','....pppp.c..','...pppppp...','..ppqppppp..','..pppppqpp..','..pqpppppp..','..pppppppp..','...ppqppp...','....pppp....'],pal:{p:'#8a5cc8',q:'#5e3672',c:'#7fd8f0'}};
var BUD=['.....cc.....','....cccc....','...ccwccc...','..gccccccg..','.ggcccdccgg.','..gccccccg..','...cdcccc...','..ggccccgg..','...gcccdg...','....cccc....','.....ss.....','.....ss.....'];
function shade(hex,f){ var n=parseInt(hex.slice(1),16); return 'rgb('+Math.round((n>>16)*f)+','+Math.round((n>>8&255)*f)+','+Math.round((n&255)*f)+')'; }
function bmp(c,b,x,y,flip){
  for(var r=0;r<b.rows.length;r++) for(var k=0,L=b.rows[r].length;k<L;k++){
    var ch=b.rows[r][k]; if(ch!=='.'){ c.fillStyle=b.pal[ch]; c.fillRect(x+(flip?L-1-k:k),y+r,1,1); }
  }
}
function icon(b){
  var c=document.createElement('canvas'); c.width=12; c.height=12;
  bmp(c.getContext('2d'),b,Math.floor((12-b.rows[0].length)/2),Math.floor((12-b.rows.length)/2));
  return c.toDataURL();
}
var ICON={};

function drawPlant(cx,by,stage,s,t,i){
  var G='#6fbf5f', D='#3f8f4a';
  if(stage===0){ px(cx-2,by-1,5,2,'#3a2a22'); px(cx,by-3,1,2,G); return; }
  var hs=[0,7,13,19,25][stage], sway=Math.round(Math.sin(t/700+i*1.7));
  for(var h=0;h<=hs;h++) px(cx+(h>hs*0.6?sway:0),by-h,1,1,D);
  var hts=[[],[5],[5,10],[5,10,16],[6,12,18,23]][stage];
  for(var j=0;j<hts.length;j++){
    var hh=hts[j], ox=hh>hs*0.6?sway:0, y0=by-hh, len=Math.max(2,2+Math.min(stage,3)-j+(stage===4?1:0));
    for(var k=1;k<=len;k++){
      var yy=y0-Math.floor(k/2);
      px(cx+ox-k,yy,1,1,G); px(cx+ox+k,yy,1,1,G);
      if(k<len){ px(cx+ox-k,yy+1,1,1,D); px(cx+ox+k,yy+1,1,1,D); }
    }
    if(stage===4&&j>=2){ px(cx+ox-len-1,y0-Math.floor(len/2)-1,2,2,s.color); px(cx+ox+len,y0-Math.floor(len/2)-1,2,2,s.color); }
  }
  px(cx+sway-1,by-hs-2,3,3,G);
  if(stage===4){
    px(cx+sway-2,by-hs-4,5,5,s.color); px(cx+sway-1,by-hs-6,3,2,s.color);
    px(cx+sway-1,by-hs-3,1,1,'#ffffff');
    if(Math.floor(t/400+i)%4===0){ px(cx+sway+5,by-hs-6,1,3,'#fff'); px(cx+sway+4,by-hs-5,3,1,'#fff'); }
  }
}

function draw(t){
  var now=Date.now(), i;
  var bands=['#2a2148','#3d2a5e','#5e3672','#8f4a7c','#c8647a','#ee9a72'];
  for(i=0;i<6;i++) px(0,i*8,W,8,bands[i]);
  for(i=0;i<STARS.length;i++) if((Math.floor(t/600)+i)%3) px(STARS[i][0],STARS[i][1],1,1,'#f6e7c8');
  for(var dy=-11;dy<=0;dy++){ var hw=Math.round(Math.sqrt(121-dy*dy)); px(118-hw,48+dy,hw*2,1,'#ffd9a0'); }
  for(i=0;i<2;i++){ var cxc=((t/500+i*110)%220)-40, cyc=10+i*14; px(cxc,cyc,18,4,'#d98fa0'); px(cxc+4,cyc-3,9,3,'#d98fa0'); px(cxc+12,cyc+2,10,3,'#c8647a'); }
  for(var x=0;x<W;x+=2){ var hgt=7+Math.round(4*Math.sin(x/17)+3*Math.sin(x/7+2)); px(x,48-hgt,2,hgt,'#3a2a55'); }
  px(0,48,W,H-48,'#4d7a5a');
  for(i=0;i<150;i++) px((i*37)%160,50+(i*53)%150,1,1,i%9===0?'#f6e7c8':(i%2?'#416b4f':'#5c8c66'));
  for(x=1;x<W;x+=10) px(x,47,2,9,'#c9a27a');
  px(0,50,W,1,'#b08a66'); px(0,53,W,1,'#b08a66');
  // 小屋與農夫
  px(6,28,30,22,'#7a4a52'); px(4,24,34,5,'#b8566a'); px(8,20,26,4,'#b8566a'); px(12,17,18,3,'#b8566a');
  px(17,37,8,13,'#3a2433'); px(27,33,6,6,Math.floor(t/1500)%7?'#ffd98a':'#f5c451');
  var fy=36+(Math.floor(t/600)%2), fx=42;
  px(fx-1,fy,8,2,'#e8c36a'); px(fx+1,fy-2,4,2,'#e8c36a'); px(fx+1,fy+2,4,3,'#f2c9a0');
  px(fx,fy+5,6,5,'#d9705a'); px(fx+1,fy+10,2,3,'#3d4a7a'); px(fx+3,fy+10,2,3,'#3d4a7a');
  // 圍籬上的貓
  var cx0=((t/110)%520)-20; if(cx0<170) bmp(ctx,BMP.cat,Math.round(cx0),41+(Math.floor(t/300)%2));
  // 自己養的寵物在田邊散步
  var pi=0;
  PETS.forEach(function(pt){
    if(!S.pets[pt.id]) return;
    var b=BMP[pt.id], wd=b.rows[0].length, span=W-wd-8, ph=(t/pt.pace+pi*97)%(span*2), right=ph<span, xx=right?ph:span*2-ph;
    bmp(ctx,b,4+Math.round(xx),61-b.rows.length-((pt.hop&&Math.floor(t/250+pi)%2)?1:0),right!==pt.faceRight);
    pi++;
  });
  // 田地
  var firstLocked=-1; for(i=0;i<9;i++) if(!S.plots[i].u){ firstLocked=i; break; }
  for(i=0;i<9;i++){
    var p=S.plots[i], r=plotRect(i);
    if(!p.u){
      px(r.x,r.y,r.w,r.h,'#3c5c48'); px(r.x+2,r.y+2,r.w-4,r.h-4,'#456a52');
      px(r.x+18,r.y+12,8,7,'#2a2148'); px(r.x+19,r.y+8,6,5,'#2a2148'); px(r.x+21,r.y+10,2,3,'#456a52');
      if(i===firstLocked){
        ctx.font='8px "Press Start 2P"'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillStyle=S.coins>=PLOT_COST[i]?'#f5c451':'#b9a8cf'; ctx.fillText(String(PLOT_COST[i]),r.x+22,r.y+24);
      }
      continue;
    }
    var wet=p.crop&&now<p.water;
    px(r.x,r.y,r.w,r.h,'#3b2a2a'); px(r.x+2,r.y+2,r.w-4,r.h-4,wet?'#5a3d33':'#7a5644');
    for(var fyy=r.y+7;fyy<r.y+r.h-6;fyy+=8) px(r.x+4,fyy,r.w-8,1,wet?'#4a3029':'#69483a');
    if(p.crop){
      var s=SMAP[p.crop], frac=Math.min(1,p.prog/s.time), ripe=frac>=1, stage=ripe?4:Math.floor(frac*4);
      drawPlant(r.x+22,r.y+33,stage,s,t,i);
      px(r.x+4,r.y+36,36,2,'#2a1f1f'); px(r.x+4,r.y+36,Math.round(36*frac),2,s.color);
      if(ripe){ var bb=Math.floor(t/250)%2; px(r.x+35,r.y+3+bb,5,5,'#f5c451'); px(r.x+37,r.y+4+bb,1,2,'#2a2148'); px(r.x+37,r.y+6+bb,1,1,'#f5c451'); px(r.x+37,r.y+7+bb,1,1,'#2a2148'); px(r.x+37,r.y+6+bb,1,1,'#f5c451'); }
      else if(!wet&&Math.floor(t/400)%2){ px(r.x+37,r.y+3,1,1,'#7fd8f0'); px(r.x+36,r.y+4,3,1,'#7fd8f0'); px(r.x+35,r.y+5,5,3,'#7fd8f0'); px(r.x+36,r.y+8,3,1,'#7fd8f0'); px(r.x+36,r.y+6,1,1,'#eafaff'); }
    }
  }
  for(i=sparks.length-1;i>=0;i--){
    var sp=sparks[i]; sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.12; sp.life--;
    px(sp.x,sp.y,1,1,sp.c); if(sp.life<=0) sparks.splice(i,1);
  }
}

cv.addEventListener('click',function(e){

    var r=plotRect(i); if(x<r.x||x>r.x+r.w||y<r.y||y>r.y+r.h) continue;
    var p=S.plots[i];
    if(!p.u){
      var first=-1; for(var k=0;k<9;k++) if(!S.plots[k].u){ first=k; break; }
      if(i!==first){ toast('先解鎖前面那塊地'); return; }
      if(S.coins<PLOT_COST[i]){ toast('解鎖這塊地要 '+PLOT_COST[i]+' 金幣'); return; }
      S.coins-=PLOT_COST[i]; p.u=true; burst(r.x+22,r.y+20,'#f5c451'); toast('新的一塊地到手');
    } else if(!p.crop){
      var s=SMAP[S.seed];
      if(S.coins<s.cost){ toast('金幣不夠買「'+s.name+'」種子（'+s.cost+'）'); return; }
      S.coins-=s.cost; p.crop=s.id; p.prog=0; p.last=now; p.water=S.upg.sprinkler?now+1e9:0;
      burst(r.x+22,r.y+30,'#7a5644');
      if(!S.upg.sprinkler) toast('種下去了，再點一下澆水');
    } else {
      grow(p,now);
      var st=SMAP[p.crop];
      if(isRipe(p)){
        var n=Math.random()<0.15+petBonus('cat')?2:1;
        S.inv[st.id]=(S.inv[st.id]||0)+n; S.stats.harvest++; if(st.id==='gold') S.stats.gold++;
        addXp(Math.ceil(st.time/10*(1+petBonus('chick')))); p.crop=null; p.prog=0;
        burst(r.x+22,r.y+12,st.color); toast(n===2?'大豐收！「'+st.name+'」 ×2':'收成「'+st.name+'」，到市場賣掉吧');
      } else if(now>=p.water){
        p.water=now+waterSpan(st); burst(r.x+22,r.y+24,'#7fd8f0');
      } else {
        toast('「'+st.name+'」還要 '+fmt((st.time-p.prog)/speed()));
      }
    }
    checkAch(); hud(); refreshPanel(); Store.save(S); return;
  }
});

        btn='<button class="btn" data-act="pet" data-id="'+pt.id+'"'+(cd>0?' disabled':'')+'>'+(cd>0?'休息 '+Math.ceil(cd)+' 秒':'摸摸')+'</button>';
      } else {
        var c=pt.cost, ok, txt;
        if(c.coins){ ok=S.coins>=c.coins; txt=c.coins+' 金幣'; }

        else { ok=S.stats.cat>=c.cat; txt=ok?'帶回家':'摸流浪貓 '+Math.min(S.stats.cat,c.cat)+'/'+c.cat; }

        if(Math.random()<chance){ S.stats.bluff++; var x=10*S.lvl; addXp(x); give('whistle');
          modal('police','過關',['「九層塔炒蛋不錯喔，加油。」','經驗 +'+x+'，他還把哨子忘在你這。'],[['呼']]); }
        else { var fine=Math.round(S.coins*0.15), ps=planted(), lost='';
          if(ps.length){ var p=S.plots[pick(ps)]; lost='，還被拔走一株「'+SMAP[p.crop].name+'」'; p.crop=null; p.prog=0; }
          S.coins-=fine; modal('police','被識破了',['「九層塔哪有長這樣。」','罰款 '+fine+' 金幣'+lost],[['下次會更小心']]); }
      }],
      ['請他喝珍奶（-'+fee+' 金幣）',function(){ S.coins-=fee; toast('警察杯杯喝著珍奶走了'); }]
    ]);
  },
  ufo:function(){
    var p=S.plots[pick(planted())], s=SMAP[p.crop], pay=s.base*3;
    p.crop=null; p.prog=0; S.stats.ufo++; addCoins(pay); give('meteor');
    modal('ufo','幽浮路過',['一道光把你的「'+s.name+'」吸走了。','外星人很有禮貌，留下 '+pay+' 金幣和一顆外星隕石。'],[['謝謝惠顧']]);
  },
  cat:function(){
    var pay=5+Math.floor(Math.random()*10*S.lvl);
    modal('cat','流浪貓來討摸',['牠在你的田邊躺下，露出肚子。'],[
      ['摸摸牠',function(){ S.stats.cat++; addCoins(pay); var hb=Math.random()<0.4; if(hb) give('hairball');
        toast(S.stats.cat>=3&&!S.pets.cat?'牠好像想跟你回家，到「寵物」看看':'貓咪叼來 '+pay+' 金幣'+(hb?'和一顆毛球':'')); }],
      ['假裝沒看到']
    ]);
  },
  granny:function(){
    var held=STRAINS.filter(function(s){return S.inv[s.id]>0;});
    give('pickle');
    if(!held.length){ var gift=20+10*S.lvl; addCoins(gift);
      modal('granny','隔壁阿嬤來串門子',['「少年欸，種菜辛苦齁。」','阿嬤塞了 '+gift+' 金幣紅包和一罐醃菜給你。'],[['謝謝阿嬤']]); return; }
    var s=held[0], n=S.inv[s.id], pay=s.base*2*n;
    modal('granny','隔壁阿嬤來買菜',['「你這地瓜葉看起來很嫩，我全包了。」','「'+s.name+'」 ×'+n+'，阿嬤出 '+pay+' 金幣（行情兩倍），還送你一罐醃菜。'],[
      ['賣給阿嬤',function(){ S.inv[s.id]=0; addCoins(pay); toast('阿嬤開心地提著菜回家'); }],
      ['「阿嬤這個不能炒啦」']
    ]);
  }
};
var nextEvent=Date.now()+50000+Math.random()*40000;
function maybeEvent(now){
  if(modalOpen||tab||now<nextEvent) return;
  nextEvent=now+60000+Math.random()*70000;
  var pool=['cat','granny']; if(planted().length){ pool.push('police','police','ufo'); }
  EVENTS[pick(pool)]();
}

/* ---------- Lofi 背景音樂（即時合成，不需要音檔） ---------- */
var AC=null, musicOn=false, beat=0, nextBeat=0, master=null, mTimer=0;
var CHORDS=[[174.6,220,261.6,329.6],[164.8,196,246.9,293.7],[146.8,174.6,220,261.6],[130.8,164.8,196,246.9]];
function tone(f,t,d,g,type){ var o=AC.createOscillator(), a=AC.createGain(); o.type=type||'triangle'; o.frequency.value=f;
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+0.08); a.gain.linearRampToValueAtTime(0,t+d); o.connect(a); a.connect(master); o.start(t); o.stop(t+d+0.05); }
function noise(t,d,g){ var n=AC.sampleRate*d, buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0);
  for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); var s=AC.createBufferSource(), a=AC.createGain(); s.buffer=buf; a.gain.value=g; s.connect(a); a.connect(master); s.start(t); }
function kick(t){ var o=AC.createOscillator(), a=AC.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.15);
  a.gain.setValueAtTime(0.5,t); a.gain.exponentialRampToValueAtTime(0.001,t+0.25); o.connect(a); a.connect(master); o.start(t); o.stop(t+0.3); }
function schedule(){
  var spb=60/74/2;
  while(nextBeat<AC.currentTime+0.4){
    var b=beat%8, bar=Math.floor(beat/8)%4;
    if(b===0) CHORDS[bar].forEach(function(f){ tone(f,nextBeat,spb*8,0.045); });
    if(b===0||b===5) kick(nextBeat);
    if(b===2||b===6) noise(nextBeat,0.12,0.09);
    if(b%2===1) noise(nextBeat+(b%4===3?0.03:0),0.03,0.035);
    if(b===3||b===7) tone(CHORDS[bar][(beat>>1)%4]*2,nextBeat,spb*1.6,0.03,'sine');
    nextBeat+=spb; beat++;
  }
}
$('music').addEventListener('click',function(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100;
      master=AC.createGain(); master.gain.value=0.9; master.connect(lp); lp.connect(AC.destination); }
    musicOn=!musicOn;
    if(musicOn){ AC.resume(); nextBeat=AC.currentTime+0.1; beat=0; mTimer=setInterval(schedule,120); }
    else { clearInterval(mTimer); AC.suspend(); }
    this.classList.toggle('on',musicOn);
  }catch(err){ toast('這個瀏覽器無法播放音樂'); }
});

/* ---------- 主迴圈 ---------- */
function resize(){
  var st=$('stage'), w=st.clientWidth, h=st.clientHeight, sc=Math.min(w/W,h/H);
  cv.style.width=Math.floor(W*sc)+'px'; cv.style.height=Math.floor(H*sc)+'px';
}
window.addEventListener('resize',resize); resize();
var lastDraw=0;
function frame(t){ if(t-lastDraw>60){ lastDraw=t; draw(t); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
var ticks=0;
function tick(){
  var now=Date.now();
  S.plots.forEach(function(p){ grow(p,now); });
  var broke=S.coins<STRAINS[0].cost&&!planted().length&&!STRAINS.some(function(s){return S.inv[s.id]>0;});
  if(broke){ S.coins+=10; toast('阿嬤看你可憐，塞了 10 金幣給你'); }
  checkAch(); hud(); if(tab==='market'||tab==='pets') refreshPanel(); maybeEvent(now);
  if(++ticks%5===0) Store.save(S);
}
setInterval(tick,1000); tick();
document.addEventListener('visibilitychange',function(){ if(document.hidden) Store.save(S); else tick(); });
if(S.stats.harvest===0&&!planted().length) setTimeout(function(){ toast('點一塊空地種下第一株'); },600);
})();
</script>
