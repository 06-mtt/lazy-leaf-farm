<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a2148">
<meta name="apple-mobile-web-app-title" content="懶草農場">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>懶草農場</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">

</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><b id="coins">0</b><small id="repl">金幣</small></div>
    <div class="stat" id="xpwrap">
      <b id="lvl">LV 1</b>
      <div id="xpbar"><div id="xpfill"></div></div>
    </div>
    <button id="seedchip" type="button"><i id="seedsw"></i><span id="seedname"></span></button>
  </div>
  <div id="stage"><canvas id="cv" width="160" height="200"></canvas><div id="labels"></div><div id="wx"></div></div>
  <div id="panel"><header><h2 id="ptitle"></h2><span id="psub"></span><button type="button" id="pclose" class="btn ghost" style="min-width:0;padding:6px 10px">關閉</button></header><div id="plist"></div></div>
  <div id="tabs">
    <button type="button" data-tab="seeds">種子</button>
    <button type="button" data-tab="bag">背包</button>
    <button type="button" data-tab="pets">寵物</button>
    <button type="button" data-tab="ach">任務</button>
    <button type="button" id="go">去小鎮</button>
    <button type="button" data-tab="upg">更多</button>
  </div>
  <div id="toast"></div>
  <div id="modal"><div id="mbox"><canvas id="mart" width="12" height="10"></canvas><h3 id="mtitle"></h3><div id="mbody"></div><div id="mbtns"></div></div></div>
  <div id="gate"><div id="gbox"><img id="glogo" alt=""><h1>懶草農場</h1><div id="gbody"></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="data.js?v=14"></script>
<script src="game.js?v=14"></script>

</body>
</html>
